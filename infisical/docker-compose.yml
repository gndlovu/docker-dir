services:
  infisical:
    container_name: infisical
    restart: unless-stopped
    image: infisical/infisical:latest # TODO PIN THIS TO A SPECIFIC TAG
    pull_policy: always
    env_file: .env
    # ports:
    #   - 80:3001
    environment:
      - NODE_ENV=production
      - DB_CONNECTION_URI=${DB_CONNECTION_URI}
      - REDIS_URL=${REDIS_URL}
    networks:
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.arcane.loadbalancer.server.port=8080"
      - "traefik.http.routers.arcane-http.entrypoints=web"
      - "traefik.http.routers.arcane-http.rule=Host(`secrets.gladwelln.dev`)"

networks:
  frontend:
    external: true