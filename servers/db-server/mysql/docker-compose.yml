services:
  mariadb:
    image: mariadb:11.4
    container_name: mariadb_node
    restart: always
    ports:
      - "3306:3306"
    environment:
      # Use dynamic environment variables, never plain-text strings
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
