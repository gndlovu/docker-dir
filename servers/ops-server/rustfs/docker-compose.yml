services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs-server
    restart: unless-stopped
    ports:
      - "9000:9000"  # S3 API Port
      - "9001:9001"  # Admin Web Console Port
    environment:
      # CRITICAL: Always change these placeholder values before exposing to a network
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
      # Target data directory inside the container
      - RUSTFS_VOLUMES=/data
    volumes:
      - /apps-data/s3:/data
    networks:
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rustfs-api.entrypoints=web"
      - "traefik.http.routers.rustfs-api.rule=Host(`${RUSTFS_API_HOSTNAME}`)"
      - "traefik.http.routers.rustfs-api.service=rustfs-api-service"
      - "traefik.http.services.rustfs-api-service.loadbalancer.server.port=9000"

      - "traefik.http.routers.rustfs-console.entrypoints=web"
      - "traefik.http.routers.rustfs-console.rule=Host(`${RUSTFS_CONSOLE_HOSTNAME}`)"
      - "traefik.http.routers.rustfs-console.service=rustfs-console-service"
      - "traefik.http.services.rustfs-console-service.loadbalancer.server.port=9001"

networks:
  frontend:
    external: true