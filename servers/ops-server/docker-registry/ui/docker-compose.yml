services:
  registry-ui:
    image: joxit/docker-registry-ui:latest
    ports:
      - 2002:80
    environment:
      - NGINX_PROXY_PASS_URL=http://${REGISTRY_HOST_IP}:5000
      - DELETE_IMAGES=true
    restart: unless-stopped
    networks:
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.registry-ui.rule=Host(`${REGISTRY_HOSTNAME}`)"
      - "traefik.http.routers.registry-ui.entrypoints=web"
      - "traefik.http.services.registry-ui.loadbalancer.server.port=2002"

networks:
  frontend:
    external: true